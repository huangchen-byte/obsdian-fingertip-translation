# =============================================================================
# 文件名: release.yml
# 功能描述: 自动化发布流程 - 当推送 Git tag 时自动构建并创建 GitHub Release
#
# 触发条件:
#   - 推送任意 Git tag 到远程仓库时触发
#   - 使用 pattern: '*' 匹配所有 tag
#
# 主要功能:
#   - 安装依赖并构建项目
#   - 使用 softprops/action-gh-release 创建 GitHub Release
#   - 上传构建产物（main.js, manifest.json, styles.css）
#
# 安全实践:
#   - 使用精确的 commit SHA 而非版本标签（防止供应链攻击）
#   - 支持 GitHub provenance attestation
#
# 依赖/要求:
#   - Node.js 24.x
#   - softprops/action-gh-release@v2
#   - Git tag 命名规范：**不带 `v` 前缀**（如：1.0.0）
# =============================================================================

name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      # ------------------------------------------------------------------------
      # 步骤1: 检出代码
      # ------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ------------------------------------------------------------------------
      # 步骤2: 设置 Node.js 24 环境
      # ------------------------------------------------------------------------
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: npm

      # ------------------------------------------------------------------------
      # 步骤3: 安装依赖并构建
      # ------------------------------------------------------------------------
      - name: Build plugin
        run: |
          npm ci
          npm run build

      # ------------------------------------------------------------------------
      # 步骤4: 生成 release notes
      # ------------------------------------------------------------------------
      - name: Generate release notes
        id: release_notes
        run: |
          # 获取前一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 生成 changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges | grep -v "^- ${{ github.ref_name }}" || true)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          # 写入文件
          cat << 'RELEASENOTES' > release-notes.md
## What's Changed
$CHANGELOG

**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}
RELEASENOTES

      # ------------------------------------------------------------------------
      # 步骤5: Attest release assets
      # ------------------------------------------------------------------------
      - name: Attest release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # ------------------------------------------------------------------------
      # 步骤6: 创建 GitHub Release
      # ------------------------------------------------------------------------
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            main.js
            manifest.json
            styles.css